[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agrispectralsynth"
version = "0.2.0"
description = "Synthetic multispectral dataset generator for precision agriculture and tree canopy analysis."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Juan Carlos Vega" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "opencv-python>=4.10",
    "Pillow>=10.0",
    "rasterio>=1.4",
    "matplotlib>=3.9",
    "PyYAML>=6.0",
    "pydantic>=2.6",
    "tqdm>=4.66",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
milliontrees = ["milliontrees"]
notebook = ["jupyter>=1.1", "ipykernel>=6.29"]

[project.scripts]
agrispectralsynth = "agrispectralsynth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
